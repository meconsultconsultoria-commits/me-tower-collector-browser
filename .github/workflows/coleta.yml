name: Coleta ME Tower

on:
  workflow_dispatch:

concurrency:
  group: me-tower-collector
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      npm_config_fetch_retries: "3"
      npm_config_fetch_retry_mintimeout: "2000"
      npm_config_fetch_retry_maxtimeout: "15000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install application dependencies
        run: npm install --no-audit --no-fund
        timeout-minutes: 2

      - name: Verify preinstalled Chromium
        run: node --input-type=module -e 'import { chromium } from "playwright"; const browser = await chromium.launch({ headless:true }); console.log("Chromium ready:", browser.version()); await browser.close();'
        timeout-minutes: 1

      - run: node --test

      - run: npm run collect
        env:
          RASTRO_USER: ${{ secrets.RASTRO_USER }}
          RASTRO_PASSWORD: ${{ secrets.RASTRO_PASSWORD }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ME_TOWER_SECRET: ${{ secrets.ME_TOWER_SECRET }}

